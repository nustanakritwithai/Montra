name: Deploy MONTRA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish MONTRA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate client JavaScript
        run: node --check main.js && node --check audio.js && node --check account-entry.js

      - name: Verify combat HUD wiring
        shell: bash
        run: |
          grep -q 'id="monsterStatus"' index.html
          grep -q 'requestMonsterAttack' main.js
          grep -q 'syncMonsterState' main.js

      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html main.js audio.js account-entry.js styles.css _site/
          # Game models (shaman body, Crescent Blade) loaded by main.js.
          cp -r assets _site/assets
          test -s _site/assets/characters/thai-male.glb
          test -s _site/assets/characters/thai-golden-spirit.glb
          test -s _site/assets/weapons/crescent-blade-lod2.glb
          mkdir -p _site/weapon-preview/lod2
          cp weapon-preview/lod2/index.html _site/weapon-preview/lod2/index.html
          cat weapon-preview/lod2/chunks/part-*.b64 | base64 --decode > _site/weapon-preview/lod2/crescent-blade-lod2.glb
          test "$(wc -c < _site/weapon-preview/lod2/crescent-blade-lod2.glb)" -eq 6307460
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
