name: Deploy MONTRA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publish MONTRA
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate client JavaScript
        run: node --check main.js

      - name: Verify combat HUD wiring
        shell: bash
        run: |
          grep -q 'id="monsterStatus"' index.html
          grep -q 'requestMonsterAttack' main.js
          grep -q 'syncMonsterState' main.js

      - name: Prepare website
        shell: bash
        run: |
          mkdir -p _site
          cp index.html main.js styles.css _site/
          if [ -d weapon-preview ]; then cp -R weapon-preview _site/; fi
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
