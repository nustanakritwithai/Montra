name: Verify MONTRA camera
on:
  push:
    paths:
      - 'main.js'
      - 'src/client/**'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'deploy/combat/camera-*.cjs'
      - '.github/workflows/verify-camera.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare generated client from sources
        run: npm run prepare:client
      - run: node --check main.js && node deploy/combat/camera-ui-test.cjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node deploy/combat/camera-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-browser-evidence
          path: camera-browser-evidence
