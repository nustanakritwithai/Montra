name: Verify MONTRA camera
on:
  push:
    paths:
      - 'main.js'
      - 'src/client/**'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'deploy/combat/camera-*.cjs'
      - '.github/workflows/verify-camera.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'src/client/**'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'deploy/combat/camera-*.cjs'
      - '.github/workflows/verify-camera.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare generated client from sources
        run: npm run prepare:client
      - run: node --check main.js && node deploy/combat/camera-ui-test.cjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
      - run: node deploy/combat/camera-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-browser-evidence
          path: camera-browser-evidence
