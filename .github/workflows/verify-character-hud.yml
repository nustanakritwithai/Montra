name: Verify compact character HUD
on:
  push:
    paths:
      - 'main.js'
      - 'src/client/**'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'styles.css'
      - 'src/styles/**'
      - 'scripts/build-styles*.mjs'
      - 'deploy/combat/release-ui-browser-test.cjs'
      - 'deploy/combat/market-catalog-ui-test.cjs'
      - 'deploy/combat/crafting-pages-ui-test.cjs'
      - 'deploy/combat/nested-recipes-*'
      - 'index.html'
      - 'deploy/combat/character-hud-*.cjs'
      - 'deploy/combat/basic-attack-*.cjs'
      - 'deploy/combat/quest-navigation-*'
      - 'deploy/combat/monster-nameplates-*.cjs'
      - '.github/workflows/verify-character-hud.yml'
  pull_request:
    paths:
      - 'main.js'
      - 'src/client/**'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
      - 'styles.css'
      - 'src/styles/**'
      - 'scripts/build-styles*.mjs'
      - 'deploy/combat/release-ui-browser-test.cjs'
      - 'deploy/combat/market-catalog-ui-test.cjs'
      - 'deploy/combat/crafting-pages-ui-test.cjs'
      - 'deploy/combat/nested-recipes-*'
      - 'index.html'
      - 'deploy/combat/character-hud-*.cjs'
      - 'deploy/combat/basic-attack-*.cjs'
      - 'deploy/combat/quest-navigation-*'
      - 'deploy/combat/monster-nameplates-*.cjs'
      - '.github/workflows/verify-character-hud.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare generated client and styles from sources
        run: |
          npm run prepare:client
          npm run build:styles
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 tsx@4.21.0
          npx playwright install --with-deps chromium
      - name: Validate helpers and render shipped client
        run: |
          node deploy/combat/monster-nameplates-ui-test.cjs
          node deploy/combat/monster-nameplates-browser-test.cjs
          node deploy/combat/character-hud-ui-test.cjs
          node deploy/combat/character-hud-browser-test.cjs
          node deploy/combat/basic-attack-ui-test.cjs
          node deploy/combat/basic-attack-browser-test.cjs
          node deploy/combat/quest-navigation-test.cjs
          node deploy/combat/quest-navigation-swipe-test.cjs
          node deploy/combat/quest-navigation-browser-test.cjs
          MONTRA_WORLD_EXPANSION=1 MONTRA_ORIGINAL_RELIEF=1 MONTRA_ATLAS_RELIEF=1 MONTRA_RIDGE_TERRAIN=1 MONTRA_CASTLE_PILOT=1 node --import tsx --test deploy/combat/quest-navigation-world-test.ts
      - name: Validate isolated market and crafting browser flows
        run: |
          node deploy/combat/release-ui-browser-test.cjs
          node --import tsx deploy/combat/nested-recipes-catalog-test.ts nested-recipes-browser-evidence/catalog.json
          MONTRA_RECIPE_CATALOG=nested-recipes-browser-evidence/catalog.json node deploy/combat/nested-recipes-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: character-hud-browser-evidence
          path: |
            basic-attack-browser-evidence
            quest-navigation-browser-evidence
            hud-browser-evidence
            monster-nameplates-browser-evidence
            release-ui-browser-evidence
            nested-recipes-browser-evidence
