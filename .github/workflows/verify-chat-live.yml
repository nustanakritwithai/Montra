name: Verify MONTRA local multiplayer chat
on:
  pull_request:
    paths:
      - 'src/client-modules/chat-controller.js'
      - 'src/client-modules/drawer-controller.js'
      - 'src/client/render/004-scene-camera-lights.js'
      - 'src/client/ui/042-vitals-chat-and-status.js'
      - 'src/client/ui/046-drawers-and-chat.js'
      - 'src/client/network/044-state-sync-and-connection.js'
      - 'deploy/combat/**'
      - 'scripts/prepare-combat-verify.sh'
      - 'scripts/build-client*.mjs'
      - 'scripts/build-styles*.mjs'
      - 'index.html'
      - 'src/styles/**'
      - 'styles.css'
      - '.github/workflows/verify-chat-live.yml'
      - '.nvmrc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare canonical disposable server and local styles
        run: |
          npm run prepare:combat
          npm run build:styles
          npm ci --prefix combat-verify --ignore-scripts
      - name: Check fixtures and preserve original differential assertions
        run: |
          node deploy/combat/chat-controller-test.cjs
          node deploy/combat/chat-browser-test.cjs --check-fixtures
          node deploy/combat/chat-live-browser-test.cjs --check-fixtures
          node deploy/combat/chat-live-fixture-test.cjs
          node deploy/combat/chat-live-dependency-check.cjs
      - name: Real-server SDK preflight without browser
        run: timeout 45s node deploy/combat/chat-live-browser-test.cjs --sdk-preflight
      - name: Install pinned browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify existing synthetic-port DOM differential
        run: timeout 120s node deploy/combat/chat-browser-test.cjs
      - name: Verify production chat bindings against local server
        run: timeout 120s node deploy/combat/chat-live-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-live-browser-evidence
          path: |
            chat-live-browser-evidence/
            chat-browser-evidence/
