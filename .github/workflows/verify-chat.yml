name: Verify MONTRA chat
on:
  push:
    paths:
      - 'src/client-modules/chat-controller.js'
      - 'src/client-modules/drawer-controller.js'
      - 'src/client/render/004-scene-camera-lights.js'
      - 'src/client/ui/042-vitals-chat-and-status.js'
      - 'src/client/ui/046-drawers-and-chat.js'
      - 'src/client/network/044-state-sync-and-connection.js'
      - 'index.html'
      - 'styles.css'
      - 'src/styles/**'
      - 'deploy/combat/chat-*.cjs'
      - 'deploy/combat/fixtures/chat-controller-*'
      - '.github/workflows/verify-chat.yml'
      - 'scripts/build-client*.mjs'
      - 'scripts/build-site*.mjs'
      - 'package.json'
      - '.nvmrc'
  pull_request:
    paths:
      - 'src/client-modules/chat-controller.js'
      - 'src/client-modules/drawer-controller.js'
      - 'src/client/render/004-scene-camera-lights.js'
      - 'src/client/ui/042-vitals-chat-and-status.js'
      - 'src/client/ui/046-drawers-and-chat.js'
      - 'src/client/network/044-state-sync-and-connection.js'
      - 'index.html'
      - 'styles.css'
      - 'src/styles/**'
      - 'deploy/combat/chat-*.cjs'
      - 'deploy/combat/fixtures/chat-controller-*'
      - '.github/workflows/verify-chat.yml'
      - 'scripts/build-client*.mjs'
      - 'scripts/build-site*.mjs'
      - 'package.json'
      - '.nvmrc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare generated client and styles
        run: |
          npm run prepare:client
          npm run build:styles
      - name: Verify frozen original and extracted lifecycle
        run: |
          node deploy/combat/chat-controller-test.cjs
          node deploy/combat/chat-browser-test.cjs --check-fixtures
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real DOM in desktop and mobile Chromium
        run: node deploy/combat/chat-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chat-browser-evidence
          path: chat-browser-evidence
