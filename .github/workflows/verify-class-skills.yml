name: Verify class skill panels
on:
  push:
    paths:
      - 'src/client/**'
      - 'main.js'
      - 'index.html'
      - 'src/styles/**'
      - 'styles.css'
      - 'scripts/build-client*.mjs'
      - 'scripts/build-styles*.mjs'
      - 'deploy/combat/class-skills-*.cjs'
      - 'deploy/combat/class-skill-routing-test.cjs'
      - 'deploy/combat/core-skill-catalog-fixture.cjs'
      - '.github/workflows/verify-class-skills.yml'
  pull_request:
    paths:
      - 'src/client/**'
      - 'index.html'
      - 'src/styles/**'
      - 'deploy/combat/class-skills-*.cjs'
      - 'deploy/combat/class-skill-routing-test.cjs'
      - 'deploy/combat/core-skill-catalog-fixture.cjs'
      - '.github/workflows/verify-class-skills.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Assemble shipped client and styles
        run: |
          npm run prepare:client
          npm run build:styles
      - name: Install pinned isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify isolated class routing and rendering
        run: |
          node deploy/combat/class-skill-routing-test.cjs
          node deploy/combat/class-skills-browser-test.cjs
          node deploy/combat/class-skills-hotbar-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class-skills-browser-evidence
          path: class-skills-browser-evidence
