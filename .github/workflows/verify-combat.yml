name: Verify MONTRA Combat Server

on:
  push:
    paths:
      - '.nvmrc'
      - '.gitattributes'
      - 'package.json'
      - 'src/client/**'
      - 'src/styles/**'
      - 'styles.css'
      - 'scripts/build-styles*.mjs'
      - 'scripts/build-client*.mjs'
      - 'scripts/check-client-boundaries.mjs'
      - 'scripts/test-client.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/prepare-combat-verify.sh'
      - 'scripts/check-contract*.mjs'
      - 'deploy/combat/**'
      - 'main.js'
      - 'audio.js'
      - 'account-entry.js'
      - 'index.html'
      - '.github/workflows/verify-combat.yml'
  pull_request:
    paths:
      - '.nvmrc'
      - '.gitattributes'
      - 'package.json'
      - 'src/client/**'
      - 'src/styles/**'
      - 'styles.css'
      - 'scripts/build-styles*.mjs'
      - 'scripts/build-client*.mjs'
      - 'scripts/check-client-boundaries.mjs'
      - 'scripts/test-client.mjs'
      - 'scripts/build-site.mjs'
      - 'scripts/prepare-combat-verify.sh'
      - 'scripts/check-contract*.mjs'
      - 'deploy/combat/**'
      - 'main.js'
      - 'audio.js'
      - 'account-entry.js'
      - 'index.html'
      - '.github/workflows/verify-combat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    env:
      MONTRA_ACCOUNTS_REQUIRED: '0'
    outputs:
      server: ${{ steps.changes.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare generated client from sources
        run: npm run prepare:client

      - name: Prepare Colyseus 0.18 test project
        run: bash scripts/prepare-combat-verify.sh

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm ci --no-audit --no-fund

      # Server integration suites only run when server-side files change; a client-only
      # change cannot affect them (the sandbox server is built from deploy/combat alone).
      - name: Detect server-side changes
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"; [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "server=true" >> "$GITHUB_OUTPUT"; echo "Full suite (no comparable base)"; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "$changed"
          if echo "$changed" | grep -Eq '^(deploy/combat/|scripts/(prepare-combat-verify\.sh|check-contract|class-|progression-audit|loot-feed-server)|package(-lock)?\.json$|\.nvmrc$|\.github/workflows/verify-combat\.yml$)'; then
            echo "server=true" >> "$GITHUB_OUTPUT"
          else
            echo "server=false" >> "$GITHUB_OUTPUT"; echo "Client-only change: server integration jobs skipped"
          fi

      - name: Check client/server contract baseline
        run: node --test scripts/check-contract.test.mjs && node scripts/check-contract.mjs

      - name: Verify client fragment statement boundaries
        run: npm run test:client-boundaries

      - name: Type-check combat server
        working-directory: combat-verify
        run: npx tsc --noEmit

      # Windows VPS tsconfig.build.json can use strictNullChecks=false.
      # Build both ways so a discriminated-union failure cannot slip past CI.
      - name: Type-check Windows-compatible non-strict server
        working-directory: combat-verify
        run: npx tsc --noEmit --strict false

      # Windows tsconfig.build.json can combine strictNullChecks=false with
      # noImplicitAny=true. Mirror a production BUILD (exclude unit-test files
      # that aren't compiled on VPS): catches TS7011 in runtime sources.
      - name: Type-check Windows noImplicitAny without strictNullChecks
        working-directory: combat-verify
        shell: bash
        run: |
          cat > tsconfig.windows-build.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "exclude": ["src/**/*.test.ts"]
          }
          EOF
          npx tsc --noEmit -p tsconfig.windows-build.json --strict false --noImplicitAny true

      - name: Validate mobile S1 client adapter
        shell: bash
        run: |
          node --check main.js
          node deploy/combat/war-map-time-test.cjs
          node deploy/combat/salvage-ui-test.cjs
          node deploy/combat/item-hunt-ui-test.cjs
          node deploy/combat/forge-copy-ui-test.cjs
          node deploy/combat/forge-pages-ui-test.cjs
          node deploy/combat/gear-comparison-ui-test.cjs
          grep -q "serverFacing" main.js
          grep -Eq 'main\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' index.html
          grep -q 'id="climb"' index.html
          grep -q 'class="skill-bar learned-bar"' index.html
          if grep -Eq 'id="(shoot|summon|possess|talisman|classSkill|attack)"' index.html; then exit 1; fi
          grep -q 'function syncFortification' main.js
          grep -q 'room.send("climb"' main.js
          grep -q "function syncSummons" main.js
          grep -q 'room.send("pot_summon"' main.js
          grep -q 'room.send("occult_skill"' main.js
          grep -q 'tapPlayerForPK' main.js
          grep -q 'pvp_hit' main.js
          grep -q 'id="pkPanel"' index.html
          grep -q 'id="characterProfile"' index.html
          grep -q 'accountSession' main.js
          grep -q 'characterSlot' main.js
          grep -q 'account-slot' account-entry.js
          grep -q '0.3.2' index.html
          grep -Fq 'function currentEquippedWeaponSlot()' main.js
          grep -Fq 'id="personalBench"' main.js
          grep -Fq 'id="bagQuickKiln"' main.js
          node deploy/combat/crafting-pages-ui-test.cjs
          node deploy/combat/character-hud-ui-test.cjs
          grep -q 'equip_weapon' main.js
          grep -q 'weaponsAvailable' deploy/combat/MyRoomState.ts
          grep -q 'grantStarterWeapons' deploy/combat/CharacterStore.ts
          grep -q 'MONTRA WEAPON BUILD PASSED.' deploy/combat/install-windows.ps1
          grep -q 'bagSlot' main.js
          grep -Fq 'sendBagCommand("use_item"' main.js
          grep -Fq 'inventory_state' main.js
          grep -Fq 'inventoryAvailable' deploy/combat/MyRoomState.ts
          grep -Fq 'inventory_record_missing' deploy/combat/CharacterStore.ts
          grep -Fq 'MONTRA INVENTORY BUILD PASSED.' deploy/combat/install-windows.ps1
          grep -q 'id="fly"' index.html
          grep -Fq 'room.send("fly", {})' main.js
          grep -Fq 'flightAvailable' main.js
          grep -Fq 'flight_started' main.js
          grep -Fq 'flight_finished' main.js
          grep -q 'room.send("dash", direction)' main.js
          grep -q 'function requestSwipeDash' main.js
          grep -q 'dashAvailable' main.js
          grep -q 'pointerdown' main.js
          grep -q 'suppressMenuClick' main.js
          grep -q 'touch-action:none' styles.css
          if grep -q 'id="dash"' index.html; then
            echo "Dash must use a bottom-menu swipe, not a new HUD button"
            exit 1
          fi
          grep -q 'CAMERA_ZOOM_MAX = 85' main.js
          node deploy/combat/camera-ui-test.cjs
          grep -q 'CAMERA_DEFAULT_BETA = 0.70' main.js
          grep -Fq 'CAMERA_DEFAULT_ALPHA = Math.PI / 2' main.js
          grep -Fq -- 'padding-top:var(--dash-swipe-reach)' styles.css
          grep -Fq -- '--dash-swipe-reach: clamp(80px, 12dvh, 108px)' styles.css
          grep -Fq 'pointer.beta + dy * .003' main.js
          grep -q 'touchSeparation()' main.js
          grep -q 'setCameraZoom(' main.js
          grep -q 'rename_character' main.js

      - name: Parse Windows PowerShell installer
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          $script = (Resolve-Path 'deploy/combat/install-windows.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-Table
            exit 1
          }
          Write-Host "Windows installer syntax OK"

      - name: Syntax-check test scripts
        shell: bash
        run: |
          node --check deploy/combat/forest-party-monster-integration.mjs
          node --check deploy/combat/smoke-test.mjs
          node --check deploy/combat/s1-integration.mjs
          node --check deploy/combat/s1-monster-ai.mjs
          node --check deploy/combat/monster-rrt-integration.mjs
          node --check deploy/combat/dash-integration.mjs
          node --check deploy/combat/flight-integration.mjs
          node --check deploy/combat/weapon-integration.mjs
          node --check deploy/combat/world-warp-integration.mjs
          node --check deploy/combat/buff-integration.mjs
          node --check deploy/combat/private-chat-integration.mjs
          node --check deploy/combat/chat-integration.mjs
          node --check deploy/combat/progression-integration.mjs
          node --check deploy/combat/character-persistence-integration.mjs
          node --check deploy/combat/free-pk-integration.mjs
          node --check deploy/combat/summon-integration.mjs
          node --check deploy/combat/elevation-integration.mjs
          node --check deploy/combat/occult-integration.mjs
          node --check deploy/combat/occult-depth-integration.mjs

      - name: Service NPC dialogue actions
        run: |
          node deploy/combat/service-npcs-ui-check.cjs
          node deploy/combat/npc-shade-touch-test.cjs
          node deploy/combat/chat-feed-identity-test.cjs
          node deploy/combat/inline-chat-ui-test.cjs
          node deploy/combat/sentinel-icon-ui-test.cjs
          node deploy/combat/speech-ui-test.cjs
          node deploy/combat/npc-human-model-test.cjs

  server-worlds:
    needs: typecheck
    if: needs.typecheck.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      MONTRA_ACCOUNTS_REQUIRED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare generated client from sources
        run: npm run prepare:client

      - name: Prepare Colyseus 0.18 test project
        run: bash scripts/prepare-combat-verify.sh

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm ci --no-audit --no-fund

      - name: Original worlds, wall layers and settlement saves
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4119 MONTRA_ORIGINAL_RELIEF=1 MONTRA_WORLD_EXPANSION=1 MONTRA_CASTLE_PILOT=1 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_TEST_URL=http://127.0.0.1:4119 MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-original-test-XXXXXX)"
          npx tsx --test src/rooms/original-relief.test.ts
          node --import tsx src/index.ts > original-world-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4119) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 140s node original-relief-integration.mjs || { cat original-world-server.log; exit 1; }
          timeout 780s node --import tsx river-city-integration.mjs || { cat original-world-server.log; exit 1; }

      - name: Existing hunt terrain, ground AI and flight saves
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4118 MONTRA_ATLAS_RELIEF=1 MONTRA_WORLD_EXPANSION=1 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_TEST_URL=http://127.0.0.1:4118 MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-relief-test-XXXXXX)"
          npx tsx --test src/rooms/atlas-relief.test.ts
          node --import tsx src/index.ts > relief-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4118) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 130s node atlas-relief-integration.mjs || { cat relief-server.log; exit 1; }

  server-forest:
    needs: typecheck
    if: needs.typecheck.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      MONTRA_ACCOUNTS_REQUIRED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare generated client from sources
        run: npm run prepare:client

      - name: Prepare Colyseus 0.18 test project
        run: bash scripts/prepare-combat-verify.sh

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm ci --no-audit --no-fund

      - name: Isolated forest party monster rewards
        shell: bash
        working-directory: combat-verify
        run: |
          # These legacy integration checks assert fixed pre-event EXP values.
          export PORT=4111 MONTRA_WORLD_EXPANSION=1 MONTRA_HUNT_EVENTS=0 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-monster-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4111
          node --import tsx src/index.ts > monster-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4111) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 100s node world-capacity-integration.mjs || { cat monster-server.log; exit 1; }
          timeout 40s node forest-party-monster-integration.mjs || { cat monster-server.log; exit 1; }
          timeout 90s node guild-integration.mjs
          timeout 230s node territory-integration.mjs
          timeout 120s node world-atlas-integration.mjs
          MONTRA_ATLAS_STAGE=hunts timeout 300s node world-atlas-integration.mjs
          MONTRA_ATLAS_STAGE=marsh-moon timeout 300s node world-atlas-integration.mjs
          MONTRA_ATLAS_STAGE=ridge-naga timeout 300s node world-atlas-integration.mjs
          MONTRA_ATLAS_STAGE=endgame timeout 300s node world-atlas-integration.mjs
          npx tsx --test src/rooms/river-city.test.ts
          timeout 85s node temple-integration.mjs
          timeout 50s node forest-guardian-integration.mjs
          kill "$SERVER_PID"
          wait "$SERVER_PID" || true
          node --import tsx src/index.ts > guardian-restart.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4111) 2>/dev/null; then break; fi; sleep 0.25; done
          MONTRA_GUILD_STAGE=read timeout 45s node guild-integration.mjs
          MONTRA_WAR_STAGE=read timeout 25s node territory-integration.mjs
          MONTRA_ATLAS_STAGE=read timeout 90s node world-atlas-integration.mjs
          MONTRA_TEMPLE_STAGE=read timeout 45s node temple-integration.mjs
          MONTRA_GUARDIAN_STAGE=read timeout 30s node forest-guardian-integration.mjs

  server-terrain:
    needs: typecheck
    if: needs.typecheck.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      MONTRA_ACCOUNTS_REQUIRED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare generated client from sources
        run: npm run prepare:client

      - name: Prepare Colyseus 0.18 test project
        run: bash scripts/prepare-combat-verify.sh

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm ci --no-audit --no-fund

      - name: Two-level ridge ramps and cross-elevation combat
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4117 MONTRA_RIDGE_TERRAIN=1 MONTRA_WORLD_EXPANSION=1 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_TEST_URL=http://127.0.0.1:4117 MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-terrain-test-XXXXXX)"
          npx tsx --test src/rooms/terrain.test.ts
          node --import tsx src/index.ts > terrain-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4117) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 230s node terrain-integration.mjs || { cat terrain-server.log; exit 1; }

      - name: Expanded forest rules and real server restart
        working-directory: combat-verify
        shell: bash
        run: |
          # Keep baseline fixed-EXP assertions independent of timed hunt bonuses.
          export MONTRA_WORLD_EXPANSION=1 MONTRA_HUNT_EVENTS=0 MONTRA_ECONOMY_ENABLED=0 PORT=4110
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-world-test-expansion-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4110
          npx tsx --test src/rooms/map-expansion.test.ts src/rooms/forest-monster-config.test.ts src/rooms/temple-map.test.ts src/rooms/world-atlas.test.ts src/rooms/territory-war.test.ts src/rooms/territory-gate-room.test.ts src/rooms/scheduled-city-war.test.ts src/rooms/all-map-war.test.ts src/rooms/territory-government.test.ts src/rooms/muay-combo.test.ts src/rooms/muay-mastery.test.ts
          node --import tsx src/index.ts > expansion-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4110) 2>/dev/null; then break; fi; sleep 0.25; done
          MONTRA_MAP_TEST_STAGE=write timeout 65s node map-expansion-integration.mjs || { cat expansion-server.log; exit 1; }
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          node --import tsx src/index.ts > expansion-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4110) 2>/dev/null; then break; fi; sleep 0.25; done
          MONTRA_MAP_TEST_STAGE=read timeout 25s node map-expansion-integration.mjs || { cat expansion-server.log; exit 1; }

      - name: Three-ring castle pilot geometry and scoring
        working-directory: combat-verify
        run: |
          export MONTRA_WORLD_EXPANSION=1 MONTRA_CASTLE_PILOT=1 MONTRA_ECONOMY_ENABLED=1 PORT=4115
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-castle-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4115
          npx tsx --test src/rooms/castle-pilot.test.ts
          export MONTRA_CASTLE_IN_PROCESS=1
          trap 'rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          timeout 540s node --import tsx castle-pilot-integration.mjs

      - name: Expanded borderland transit and siege support
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4116 MONTRA_WORLD_EXPANSION=1 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-front-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4116
          node --import tsx src/index.ts > front-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4116) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 240s node --import tsx province-fronts-integration.mjs || { cat front-server.log; exit 1; }

  server-combat:
    needs: typecheck
    if: needs.typecheck.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      MONTRA_ACCOUNTS_REQUIRED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare generated client from sources
        run: npm run prepare:client

      - name: Prepare Colyseus 0.18 test project
        run: bash scripts/prepare-combat-verify.sh

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm ci --no-audit --no-fund

      - name: Isolated party, private and bug chat
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4112 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-chat-private-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4112
          node --import tsx src/index.ts > private-chat-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4112) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 30s node private-chat-integration.mjs || { cat private-chat-server.log; exit 1; }

      - name: Isolated Muay and territory battlefield
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4114 MONTRA_ECONOMY_ENABLED=1 MONTRA_WORLD_EXPANSION=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-muay-war-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4114
          node --import tsx src/index.ts > muay-war-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4114) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 90s node muay-territory-integration.mjs || { cat muay-war-server.log; exit 1; }

      - name: Isolated possession buffs
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4113 MONTRA_ECONOMY_ENABLED=1 MONTRA_WORLD_EXPANSION=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-buff-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4113
          node --import tsx src/index.ts > buff-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4113) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 30s node buff-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 30s node build-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 45s node ward-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 40s node blade-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 30s node ritual-skills-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 35s node phutthaisawan-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 50s node muay-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 50s node muay-book-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 60s node muay-schools-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 50s node muay-combo-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 55s node muay-pvp-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 35s node muay-grapple-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 40s node muay-followup-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 35s node muay-defense-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 45s node muay-schools-depth-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 40s node muay-grapple-response-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 65s node muay-mastery-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 60s node sword-tree-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 75s node sword-tree-combat-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 35s node sword-tree-party-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 40s node sword-tree-area-integration.mjs || { cat buff-server.log; exit 1; }
          timeout 30s node sword-tree-pvp-integration.mjs || { cat buff-server.log; exit 1; }

      - name: Isolated economy transactions and restart
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4109 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-economy-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4109
          node --import tsx src/index.ts > economy-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4109) 2>/dev/null; then break; fi; sleep 0.25; done
          MONTRA_ECONOMY_TEST_STAGE=write timeout 30s node economy-integration.mjs || { cat economy-server.log; exit 1; }
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          node --import tsx src/index.ts > economy-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4109) 2>/dev/null; then break; fi; sleep 0.25; done
          MONTRA_ECONOMY_TEST_STAGE=read timeout 30s node economy-integration.mjs || { cat economy-server.log; exit 1; }

      - name: Two-player server-authoritative combat integration test
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4108
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-world-test-XXXXXX)"
          export MONTRA_S2_TEST_TOKEN="mt1_$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          export MONTRA_PROGRESSION_TEST_TOKEN="mt1_$(node -e 'console.log(require("node:crypto").randomBytes(32).toString("hex"))')"
          npx tsx src/index.ts > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4108) 2>/dev/null; then break; fi
            sleep 0.25
          done
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 30s node chat-integration.mjs || {
            echo "=== CHAT SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 MONTRA_PROGRESSION_TEST_STAGE=write timeout 55s node progression-integration.mjs || {
            echo "=== PROGRESSION SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 60s node world-warp-integration.mjs || {
            echo "=== WORLD WARP SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 45s node weapon-integration.mjs || {
            echo "=== WEAPON SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 50s node flight-integration.mjs || {
            echo "=== FLIGHT SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 45s node dash-integration.mjs || {
            echo "=== DASH SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 48s node monster-rrt-integration.mjs || {
            echo "=== MONSTER RRT SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 75s node elevation-integration.mjs || {
            echo "=== ELEVATION SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 24s node smoke-test.mjs || {
            echo "=== SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 75s node s1-integration.mjs || {
            echo "=== S1 SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 25s node s1-monster-ai.mjs || {
            echo "=== MONSTER AI LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 75s node free-pk-integration.mjs || {
            echo "=== FREE PK SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 95s node summon-integration.mjs || {
            echo "=== SUMMON SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 MONTRA_S2_TEST_STAGE=write timeout 45s node character-persistence-integration.mjs || {
            echo "=== S2 WRITE SERVER LOG ==="
            cat server.log
            exit 1
          }
          # Restart Node with the SAME private data directory: this verifies
          # actual disk durability, not an in-memory room/session cache.
          kill "$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          npx tsx src/index.ts > restarted-server.log 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4108) 2>/dev/null; then break; fi
            sleep 0.25
          done
          MONTRA_TEST_URL=http://127.0.0.1:4108 MONTRA_PROGRESSION_TEST_STAGE=read timeout 20s node progression-integration.mjs || {
            echo "=== PROGRESSION RESTART SERVER LOG ==="
            cat restarted-server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 MONTRA_S2_TEST_STAGE=read timeout 30s node character-persistence-integration.mjs || {
            echo "=== S2 RESTART SERVER LOG ==="
            cat restarted-server.log
            exit 1
          }

  server-classes:
    needs: typecheck
    if: needs.typecheck.outputs.server == 'true'
    runs-on: ubuntu-latest
    env:
      MONTRA_ACCOUNTS_REQUIRED: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Prepare generated client from sources
        run: npm run prepare:client

      - name: Prepare Colyseus 0.18 test project
        run: bash scripts/prepare-combat-verify.sh

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm ci --no-audit --no-fund

      - name: Test committed inventory pickup display contract
        run: node --import ./combat-verify/node_modules/tsx/dist/loader.mjs scripts/loot-feed-server-contract.mjs

      - name: Test harvest sites and shared world regeneration
        working-directory: combat-verify
        env:
          MONTRA_WORLD_EXPANSION: '1'
        run: npx tsx --test src/rooms/resource-gathering.test.ts

      - name: Test forest harvesting through the game server
        working-directory: combat-verify
        shell: bash
        run: |
          export PORT=14218 MONTRA_TEST_URL=http://127.0.0.1:14218 MONTRA_WORLD_EXPANSION=1 MONTRA_HUNT_EVENTS=0 MONTRA_ACCOUNTS_REQUIRED=0 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-resource-test-XXXXXX)"
          node --import tsx src/index.ts > resource-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/14218) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 45s node resource-gathering-integration.mjs || { cat resource-server.log; exit 1; }

      - name: Test world director events and rewards
        working-directory: combat-verify
        env:
          MONTRA_WORLD_EXPANSION: '1'
          MONTRA_TYPHOON_API_KEY: ''
          MONTRA_DIRECTOR_PERSIST: '0'
        run: npx tsx --test src/rooms/world-director.test.ts src/rooms/director-reward.test.ts src/rooms/director-accept.test.ts src/rooms/director-deadline.test.ts

      - name: Test central marketplace escrow and reserve
        working-directory: combat-verify
        run: npx tsx --test src/rooms/central-market.test.ts

      - name: Test central marketplace across rooms and restart
        working-directory: combat-verify
        env:
          MONTRA_CENTRAL_SERVER_SOURCE: '1'
        run: timeout 180s node central-market-integration.mjs

      - name: Test persistent hunt events
        working-directory: combat-verify
        env:
          MONTRA_WORLD_EXPANSION: '1'
        run: npx tsx --test src/rooms/hunt-events.test.ts

      - name: Test Typhoon NPC guidance
        working-directory: combat-verify
        env:
          MONTRA_WORLD_EXPANSION: '1'
          MONTRA_TYPHOON_API_KEY: ''
          MONTRA_DIRECTOR_PERSIST: '0'
        run: npx tsx --test src/rooms/typhoon-guide.test.ts src/rooms/npc-guide-room.test.ts

      - name: Test quest kill progress and completion guidance
        working-directory: combat-verify
        env:
          MONTRA_WORLD_EXPANSION: '1'
          MONTRA_DIRECTOR_PERSIST: '0'
          MONTRA_ECONOMY_ENABLED: '0'
        run: npx tsx --test src/rooms/quest-guidance-room.test.ts src/rooms/quest-kill-progress-room.test.ts

      - name: Test strict message validation and movement math
        working-directory: combat-verify
        run: npx tsx --test src/rooms/skill-hotbar.test.ts src/rooms/skill-hotbar-disabled.test.ts src/rooms/rebirth-hotbar-room.test.ts src/rooms/s1-rules.test.ts src/rooms/height-rules.test.ts src/rooms/monster-rrt.test.ts src/rooms/character-store.test.ts src/rooms/rebirth.test.ts src/rooms/forest-objectives.test.ts src/rooms/sword-tree-concurrency.test.ts src/rooms/sword-gap-geometry.test.ts src/rooms/dash-rules.test.ts src/rooms/item-rules.test.ts src/rooms/world-warp-rules.test.ts src/rooms/chat-rules.test.ts src/rooms/progression.test.ts src/rooms/progression-transaction.test.ts src/rooms/economy-store.test.ts src/rooms/gear-progression.test.ts src/rooms/economy-migration.test.ts src/rooms/party-manager.test.ts src/rooms/party-experience.test.ts src/rooms/monster-profiles.test.ts src/rooms/party-monster-rewards.test.ts src/rooms/buffs.test.ts src/rooms/stat-modifiers.test.ts src/rooms/buff-ledger.test.ts src/rooms/balance-estimates.test.ts src/rooms/forge.test.ts src/rooms/guild-store.test.ts

      - name: Test guild city production, market settlement, and takeover recovery
        working-directory: combat-verify
        run: npx tsx --test src/rooms/city-production.test.ts

      - name: Learn skills anywhere without weakening progression safeguards
        working-directory: combat-verify
        env:
          MONTRA_WORLD_EXPANSION: '1'
        run: npx tsx --test src/rooms/skill-learning-location.test.ts

      - name: Occult book rules
        working-directory: combat-verify
        run: npx tsx --test src/rooms/occult-rules.test.ts src/rooms/blade-rules.test.ts src/rooms/sentinel-rules.test.ts src/rooms/skill-ranks.test.ts src/rooms/advanced-lessons.test.ts src/rooms/account-store.test.ts

      - name: Blade core skills
        working-directory: combat-verify
        run: npx tsx blade-core-check.mjs

      - name: Verify six class skill contracts through isolated server
        working-directory: combat-verify
        shell: bash
        run: |
          export PORT=14229 MONTRA_TEST_URL=http://127.0.0.1:14229 MONTRA_ACCOUNTS_REQUIRED=0 MONTRA_ECONOMY_ENABLED=1 MONTRA_WORLD_EXPANSION=1 MONTRA_HUNT_EVENTS=0
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-class-skills-test-XXXXXX)"
          node --import tsx src/index.ts > class-skills-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/14229) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 180s node --import tsx class-skills-contract-integration.mjs || { cat class-skills-server.log; exit 1; }

      - name: Early war participation
        working-directory: combat-verify
        run: npx tsx war-entry-check.mjs

      - name: Forest objectives and durable rewards
        working-directory: combat-verify
        run: npx tsx forest-objective-check.mjs

      - name: Service NPC placement
        working-directory: combat-verify
        run: npx tsx service-npcs-check.mjs

      - name: Isolated advanced class lessons
        working-directory: combat-verify
        shell: bash
        run: |
          export PORT=14215 MONTRA_ACCOUNTS_REQUIRED=0 MONTRA_ECONOMY_ENABLED=1 MONTRA_TEST_URL=http://127.0.0.1:14215
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-advanced-test-XXXXXX)"
          node --import tsx src/index.ts > advanced-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/14215) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node advanced-class-integration.mjs || { cat advanced-server.log; exit 1; }
          timeout 180s node mixed-hotbar-integration.mjs || { cat advanced-server.log; exit 1; }

      - name: Isolated class skill ranks and save compatibility
        working-directory: combat-verify
        shell: bash
        run: |
          export PORT=14213 MONTRA_ACCOUNTS_REQUIRED=0 MONTRA_ECONOMY_ENABLED=1 MONTRA_TEST_URL=http://127.0.0.1:14213
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-class-rank-test-XXXXXX)"
          node --import tsx src/index.ts > class-rank-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/14213) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node class-rank-integration.mjs || { cat class-rank-server.log; exit 1; }

      - name: Field skill learning persists with JSON and SQLite saves
        working-directory: combat-verify
        shell: bash
        run: |
          set -euo pipefail
          export MONTRA_ACCOUNTS_REQUIRED=0 MONTRA_WORLD_EXPANSION=1 MONTRA_HUNT_EVENTS=0
          for economy in 0 1; do
            export MONTRA_ECONOMY_ENABLED="$economy" PORT="$((14241 + economy))"
            export MONTRA_TEST_URL="http://127.0.0.1:$PORT"
            export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-class-rank-test-XXXXXX)"
            node --import tsx src/index.ts > "skill-learning-$economy-server.log" 2>&1 &
            SERVER_PID=$!
            trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
            for attempt in $(seq 1 60); do if (echo > "/dev/tcp/127.0.0.1/$PORT") 2>/dev/null; then break; fi; sleep 0.25; done
            timeout 90s node skill-learning-integration.mjs || { cat "skill-learning-$economy-server.log"; exit 1; }
            kill "$SERVER_PID"
            wait "$SERVER_PID" 2>/dev/null || true
            rm -rf "$MONTRA_CHARACTER_DIR"
            trap - EXIT
          done

      - name: Isolated character status and support ranks
        working-directory: combat-verify
        shell: bash
        run: |
          export PORT=14217 MONTRA_ACCOUNTS_REQUIRED=0 MONTRA_ECONOMY_ENABLED=1 MONTRA_TEST_URL=http://127.0.0.1:14217
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-status-test-XXXXXX)"
          node --import tsx src/index.ts > status-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/14217) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node status-support-integration.mjs || { cat status-server.log; exit 1; }

      - name: Isolated account and permanent class
        working-directory: combat-verify
        shell: bash
        run: |
          export MONTRA_ACCOUNTS_REQUIRED=1 MONTRA_ECONOMY_ENABLED=1 PORT=14199 MONTRA_TEST_URL=http://127.0.0.1:14199
          export MONTRA_CHARACTER_DIR="$(mktemp -d "${RUNNER_TEMP}/montra-account-test-XXXXXX")"
          npx tsx src/index.ts > "$RUNNER_TEMP/montra-account-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for n in {1..60}; do if curl -s -o /dev/null "$MONTRA_TEST_URL/montra/account/slots"; then break; fi; sleep 1; done
          node account-integration.mjs
          node learned-hotbar-integration.mjs
          node personal-equipment-integration.mjs
          node guest-delete-integration.mjs
          node mount-integration.mjs
          node gear-look-integration.mjs

      - name: Rebirth mastery math and combat runtime
        working-directory: combat-verify
        run: MONTRA_MASTERY_ENABLED=1 npx tsx --test src/rooms/rebirth-combat.test.ts src/rooms/mastery-runtime.test.ts

      - name: Isolated six-class hunt and rebirth
        working-directory: combat-verify
        shell: bash
        run: |
          export MONTRA_MASTERY_ENABLED=1 MONTRA_ACCOUNTS_REQUIRED=1 MONTRA_ECONOMY_ENABLED=1 MONTRA_WORLD_EXPANSION=1 PORT=14216 MONTRA_TEST_URL=http://127.0.0.1:14216
          export MONTRA_CHARACTER_DIR="$(mktemp -d "${RUNNER_TEMP}/montra-account-test-XXXXXX")"
          npx tsx src/index.ts > "$RUNNER_TEMP/montra-hunting-rebirth.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for n in {1..60}; do if curl -s -o /dev/null "$MONTRA_TEST_URL/montra/account/slots"; then break; fi; sleep 1; done
          node hunting-rebirth-integration.mjs
          node mastery-save-integration.mjs

      - name: Check class balance fixtures
        shell: bash
        run: |
          combat-verify/node_modules/.bin/tsc scripts/class-balance.ts scripts/class-rotation.ts scripts/progression-audit.ts --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck --typeRoots combat-verify/node_modules/@types
          combat-verify/node_modules/.bin/tsx scripts/class-balance.ts > /dev/null
          combat-verify/node_modules/.bin/tsx scripts/class-rotation.ts > /dev/null
          MONTRA_WORLD_EXPANSION=1 combat-verify/node_modules/.bin/tsx scripts/progression-audit.ts > /dev/null

      - name: Isolated occult class
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4115 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-occult-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4115
          node --import tsx src/index.ts > occult-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4115) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 100s node occult-integration.mjs || { cat occult-server.log; exit 1; }
          timeout 100s node occult-depth-integration.mjs || { cat occult-server.log; exit 1; }
          timeout 60s node class-balance-integration.mjs || { cat occult-server.log; exit 1; }

      - name: Isolated blade book
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4115 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-blade-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4115
          node --import tsx src/index.ts > blade-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4115) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node blade-book-integration.mjs || { cat blade-server.log; exit 1; }
          timeout 60s node blade-depth-integration.mjs || { cat blade-server.log; exit 1; }
          node --import tsx --test auto-attack.test.mjs
          timeout 60s node blade-advanced-integration.mjs || { cat blade-server.log; exit 1; }

      - name: Isolated sentinel class
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4117 MONTRA_ECONOMY_ENABLED=1 MONTRA_WORLD_EXPANSION=1 MONTRA_RIDGE_TERRAIN=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-sentinel-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4117
          node --import tsx src/index.ts > sentinel-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4117) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node sentinel-integration.mjs || { cat sentinel-server.log; exit 1; }

      - name: Isolated party and EXP integration
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4110 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-party-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4110
          node --import tsx src/index.ts > party-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4110) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 35s node party-integration.mjs || { cat party-server.log; exit 1; }
