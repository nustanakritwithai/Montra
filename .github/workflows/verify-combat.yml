name: Verify MONTRA Combat Server

on:
  push:
    paths:
      - 'deploy/combat/**'
      - 'main.js'
      - 'index.html'
      - '.github/workflows/verify-combat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Colyseus 0.18 test project
        shell: bash
        run: |
          mkdir -p combat-verify/src/rooms/schema
          cp deploy/combat/MyRoom.ts combat-verify/src/rooms/MyRoom.ts
          cp deploy/combat/MyRoomState.ts combat-verify/src/rooms/schema/MyRoomState.ts
          cp deploy/combat/GameRules.ts combat-verify/src/rooms/GameRules.ts
          cp deploy/combat/HeightRules.ts combat-verify/src/rooms/HeightRules.ts
          cp deploy/combat/MonsterRRT.ts combat-verify/src/rooms/MonsterRRT.ts
          cp deploy/combat/height-rules.test.ts combat-verify/src/rooms/height-rules.test.ts
          cp deploy/combat/monster-rrt.test.ts combat-verify/src/rooms/monster-rrt.test.ts
          cp deploy/combat/smoke-test.mjs combat-verify/smoke-test.mjs
          cp deploy/combat/s1-integration.mjs combat-verify/s1-integration.mjs
          cp deploy/combat/s1-monster-ai.mjs combat-verify/s1-monster-ai.mjs
          cp deploy/combat/free-pk-integration.mjs combat-verify/free-pk-integration.mjs
          cp deploy/combat/summon-integration.mjs combat-verify/summon-integration.mjs
          cp deploy/combat/elevation-integration.mjs combat-verify/elevation-integration.mjs
          cp deploy/combat/s1-rules.test.ts combat-verify/src/rooms/s1-rules.test.ts
          cat > combat-verify/src/index.ts <<'EOF'
          import { defineServer, defineRoom } from "colyseus";
          import { MyRoom } from "./rooms/MyRoom.js";
          const server = defineServer({ rooms: { my_room: defineRoom(MyRoom) } });
          server.listen(Number(process.env.PORT || 4108));
          EOF
          cat > combat-verify/package.json <<'EOF'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "colyseus": "0.18.2",
              "@colyseus/schema": "5.0.14",
              "@colyseus/sdk": "0.18.1"
            },
            "devDependencies": {
              "typescript": "5.9.3",
              "@types/node": "^22.0.0",
              "tsx": "4.21.0"
            }
          }
          EOF
          cat > combat-verify/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["src/**/*.ts"]
          }
          EOF

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm install --no-audit --no-fund

      - name: Type-check combat server
        working-directory: combat-verify
        run: npx tsc --noEmit

      - name: Validate mobile S1 client adapter
        shell: bash
        run: |
          node --check main.js
          grep -q "serverFacing" main.js
          grep -q "main.js?v=0.1.9" index.html
          grep -q 'id="climb"' index.html
          grep -q 'id="shoot"' index.html
          grep -q 'function syncFortification' main.js
          grep -q 'room.send("climb"' main.js
          grep -q 'room.send("shoot"' main.js
          grep -q "function syncSummons" main.js
          grep -q 'room.send(active ? "unsummon" : "summon", {})' main.js
          grep -q 'tapPlayerForPK' main.js
          grep -q 'pvp_hit' main.js
          grep -q 'id="pkPanel"' index.html

      - name: Parse Windows PowerShell installer
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          $script = (Resolve-Path 'deploy/combat/install-windows.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-Table
            exit 1
          }
          Write-Host "Windows installer syntax OK"

      - name: Syntax-check test scripts
        shell: bash
        run: |
          node --check deploy/combat/smoke-test.mjs
          node --check deploy/combat/s1-integration.mjs
          node --check deploy/combat/s1-monster-ai.mjs
          node --check deploy/combat/free-pk-integration.mjs
          node --check deploy/combat/summon-integration.mjs
          node --check deploy/combat/elevation-integration.mjs

      - name: Test strict message validation and movement math
        working-directory: combat-verify
        run: npx tsx --test src/rooms/s1-rules.test.ts src/rooms/height-rules.test.ts src/rooms/monster-rrt.test.ts

      - name: Two-player server-authoritative combat integration test
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4108
          npx tsx src/index.ts > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4108) 2>/dev/null; then break; fi
            sleep 0.25
          done
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 75s node elevation-integration.mjs || {
            echo "=== ELEVATION SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 24s node smoke-test.mjs || {
            echo "=== SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 75s node s1-integration.mjs || {
            echo "=== S1 SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 25s node s1-monster-ai.mjs || {
            echo "=== MONSTER AI LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 55s node free-pk-integration.mjs || {
            echo "=== FREE PK SERVER LOG ==="
            cat server.log
            exit 1
          }
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 75s node summon-integration.mjs || {
            echo "=== SUMMON SERVER LOG ==="
            cat server.log
            exit 1
          }
