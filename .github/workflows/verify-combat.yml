name: Verify MONTRA Combat Server

on:
  push:
    paths:
      - 'deploy/combat/**'
      - '.github/workflows/verify-combat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare Colyseus 0.18 test project
        shell: bash
        run: |
          mkdir -p combat-verify/src/rooms/schema
          cp deploy/combat/MyRoom.ts combat-verify/src/rooms/MyRoom.ts
          cp deploy/combat/MyRoomState.ts combat-verify/src/rooms/schema/MyRoomState.ts
          cp deploy/combat/smoke-test.mjs combat-verify/smoke-test.mjs
          cat > combat-verify/src/index.ts <<'EOF'
          import { defineServer, defineRoom } from "colyseus";
          import { MyRoom } from "./rooms/MyRoom.js";
          const server = defineServer({ rooms: { my_room: defineRoom(MyRoom) } });
          server.listen(Number(process.env.PORT || 4108));
          EOF
          cat > combat-verify/package.json <<'EOF'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "colyseus": "0.18.2",
              "@colyseus/schema": "5.0.14",
              "@colyseus/sdk": "0.18.1"
            },
            "devDependencies": {
              "typescript": "5.9.3",
              "@types/node": "^22.0.0",
              "tsx": "4.21.0"
            }
          }
          EOF
          cat > combat-verify/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["src/**/*.ts"]
          }
          EOF

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm install --no-audit --no-fund

      - name: Type-check combat server
        working-directory: combat-verify
        run: npx tsc --noEmit

      - name: Syntax-check smoke test
        run: node --check deploy/combat/smoke-test.mjs

      - name: Two-player server-authoritative combat integration test
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4108
          npx tsx src/index.ts > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if (echo > /dev/tcp/127.0.0.1/4108) 2>/dev/null; then break; fi
            sleep 0.25
          done
          MONTRA_TEST_URL=http://127.0.0.1:4108 timeout 22s node smoke-test.mjs || {
            echo "=== SERVER LOG ==="
            cat server.log
            exit 1
          }
