          cp deploy/combat/occult-depth-integration.mjs combat-verify/occult-depth-integration.mjs
          cp deploy/combat/muay-combo.test.ts combat-verify/src/rooms/muay-combo.test.ts
          cp deploy/combat/muay-mastery.test.ts combat-verify/src/rooms/muay-mastery.test.ts
          cp deploy/combat/muay-integration.mjs combat-verify/muay-integration.mjs
          cp deploy/combat/muay-book-integration.mjs combat-verify/muay-book-integration.mjs
          cp deploy/combat/muay-schools-integration.mjs combat-verify/muay-schools-integration.mjs
          cp deploy/combat/muay-combo-integration.mjs combat-verify/muay-combo-integration.mjs
          cp deploy/combat/muay-pvp-integration.mjs combat-verify/muay-pvp-integration.mjs
          cp deploy/combat/muay-grapple-integration.mjs combat-verify/muay-grapple-integration.mjs
          cp deploy/combat/muay-followup-integration.mjs combat-verify/muay-followup-integration.mjs
          cp deploy/combat/muay-defense-integration.mjs combat-verify/muay-defense-integration.mjs
          cp deploy/combat/muay-schools-depth-integration.mjs combat-verify/muay-schools-depth-integration.mjs
          cp deploy/combat/muay-grapple-response-integration.mjs combat-verify/muay-grapple-response-integration.mjs
          cp deploy/combat/muay-mastery-integration.mjs combat-verify/muay-mastery-integration.mjs
          cp deploy/combat/muay-territory-integration.mjs combat-verify/muay-territory-integration.mjs
          cp deploy/combat/build-integration.mjs combat-verify/build-integration.mjs
          cp deploy/combat/ward-integration.mjs combat-verify/ward-integration.mjs
          cp deploy/combat/blade-integration.mjs combat-verify/blade-integration.mjs
          cp deploy/combat/ritual-skills-integration.mjs combat-verify/ritual-skills-integration.mjs
          cp deploy/combat/phutthaisawan-integration.mjs combat-verify/phutthaisawan-integration.mjs
          cp deploy/combat/sword-tree-integration.mjs combat-verify/sword-tree-integration.mjs
          cp deploy/combat/sword-tree-combat-integration.mjs combat-verify/sword-tree-combat-integration.mjs
          cp deploy/combat/sword-tree-party-integration.mjs combat-verify/sword-tree-party-integration.mjs
          cp deploy/combat/sword-tree-area-integration.mjs combat-verify/sword-tree-area-integration.mjs
          cp deploy/combat/sword-tree-pvp-integration.mjs combat-verify/sword-tree-pvp-integration.mjs
          cp deploy/combat/BuffLedger.ts combat-verify/src/rooms/BuffLedger.ts
          cp deploy/combat/stat-modifiers.test.ts combat-verify/src/rooms/stat-modifiers.test.ts
          cp deploy/combat/buff-ledger.test.ts combat-verify/src/rooms/buff-ledger.test.ts
          cp deploy/combat/BalanceEstimates.ts combat-verify/src/rooms/BalanceEstimates.ts
          cp deploy/combat/balance-estimates.test.ts combat-verify/src/rooms/balance-estimates.test.ts
          cp deploy/combat/buffs.test.ts combat-verify/src/rooms/buffs.test.ts
          cp deploy/combat/buff-integration.mjs combat-verify/buff-integration.mjs
          cp deploy/combat/MonsterProfiles.ts combat-verify/src/rooms/MonsterProfiles.ts
          cp deploy/combat/PartyMonsterRewards.ts combat-verify/src/rooms/PartyMonsterRewards.ts
          cp deploy/combat/monster-profiles.test.ts combat-verify/src/rooms/monster-profiles.test.ts
          cp deploy/combat/party-monster-rewards.test.ts combat-verify/src/rooms/party-monster-rewards.test.ts
          cp deploy/combat/forest-monster-config.test.ts combat-verify/src/rooms/forest-monster-config.test.ts
          cp deploy/combat/forest-guardian-integration.mjs combat-verify/forest-guardian-integration.mjs
          cp deploy/combat/forest-party-monster-integration.mjs combat-verify/forest-party-monster-integration.mjs
          cp deploy/combat/TerritoryGovernment.ts combat-verify/src/rooms/TerritoryGovernment.ts
          cp deploy/combat/TerritoryWar.ts combat-verify/src/rooms/TerritoryWar.ts
          cp deploy/combat/territory-war.test.ts combat-verify/src/rooms/territory-war.test.ts
          cp deploy/combat/territory-government.test.ts combat-verify/src/rooms/territory-government.test.ts
          cp deploy/combat/territory-integration.mjs combat-verify/territory-integration.mjs
          cp deploy/combat/province-fronts-integration.mjs combat-verify/province-fronts-integration.mjs
          cp deploy/combat/GuildStore.ts combat-verify/src/rooms/GuildStore.ts
          cp deploy/combat/guild-store.test.ts combat-verify/src/rooms/guild-store.test.ts
          cp deploy/combat/guild-integration.mjs combat-verify/guild-integration.mjs
          cp deploy/combat/PartyManager.ts combat-verify/src/rooms/PartyManager.ts
          cp deploy/combat/party-manager.test.ts combat-verify/src/rooms/party-manager.test.ts
          cp deploy/combat/party-experience.test.ts combat-verify/src/rooms/party-experience.test.ts
          cp deploy/combat/party-integration.mjs combat-verify/party-integration.mjs
          cp deploy/combat/EconomyStore.ts combat-verify/src/rooms/EconomyStore.ts
          cp deploy/combat/EconomyRules.ts combat-verify/src/rooms/EconomyRules.ts
          cp deploy/combat/economy-store.test.ts combat-verify/src/rooms/economy-store.test.ts
          cp deploy/combat/economy-migration.test.ts combat-verify/src/rooms/economy-migration.test.ts
          cp deploy/combat/economy-integration.mjs combat-verify/economy-integration.mjs
          cp deploy/combat/progression.test.ts combat-verify/src/rooms/progression.test.ts
          cp deploy/combat/progression-transaction.test.ts combat-verify/src/rooms/progression-transaction.test.ts
          cp deploy/combat/world-warp-rules.test.ts combat-verify/src/rooms/world-warp-rules.test.ts
          cp deploy/combat/MonsterRRT.ts combat-verify/src/rooms/MonsterRRT.ts
          cp deploy/combat/CharacterStore.ts combat-verify/src/rooms/CharacterStore.ts
          cp deploy/combat/ItemRules.ts combat-verify/src/rooms/ItemRules.ts
          cp deploy/combat/item-rules.test.ts combat-verify/src/rooms/item-rules.test.ts
          cp deploy/combat/height-rules.test.ts combat-verify/src/rooms/height-rules.test.ts
          cp deploy/combat/monster-rrt.test.ts combat-verify/src/rooms/monster-rrt.test.ts
          cp deploy/combat/character-store.test.ts combat-verify/src/rooms/character-store.test.ts
          cp deploy/combat/sword-tree-concurrency.test.ts combat-verify/src/rooms/sword-tree-concurrency.test.ts
          cp deploy/combat/sword-gap-geometry.test.ts combat-verify/src/rooms/sword-gap-geometry.test.ts
          cp deploy/combat/smoke-test.mjs combat-verify/smoke-test.mjs
          cp deploy/combat/s1-integration.mjs combat-verify/s1-integration.mjs
          cp deploy/combat/s1-monster-ai.mjs combat-verify/s1-monster-ai.mjs
          cp deploy/combat/monster-rrt-integration.mjs combat-verify/monster-rrt-integration.mjs
          cp deploy/combat/dash-integration.mjs combat-verify/dash-integration.mjs
          cp deploy/combat/flight-integration.mjs combat-verify/flight-integration.mjs
          cp deploy/combat/weapon-integration.mjs combat-verify/weapon-integration.mjs
          cp deploy/combat/world-warp-integration.mjs combat-verify/world-warp-integration.mjs
          cp deploy/combat/chat-integration.mjs combat-verify/chat-integration.mjs
          cp deploy/combat/progression-integration.mjs combat-verify/progression-integration.mjs
          cp deploy/combat/character-persistence-integration.mjs combat-verify/character-persistence-integration.mjs
          cp deploy/combat/free-pk-integration.mjs combat-verify/free-pk-integration.mjs
          cp deploy/combat/summon-integration.mjs combat-verify/summon-integration.mjs
          cp deploy/combat/elevation-integration.mjs combat-verify/elevation-integration.mjs
          cp deploy/combat/s1-rules.test.ts combat-verify/src/rooms/s1-rules.test.ts
          cat > combat-verify/src/index.ts <<'EOF'
          import { defineServer, defineRoom } from "colyseus";
          import { MyRoom } from "./rooms/MyRoom.js";
          const server = defineServer({ rooms: { my_room: defineRoom(MyRoom) } });
          server.listen(Number(process.env.PORT || 4108));
          EOF
          cat > combat-verify/package.json <<'EOF'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "colyseus": "0.18.2",
              "@colyseus/schema": "5.0.14",
              "@colyseus/sdk": "0.18.1"
            },
            "overrides": {
              "@colyseus/core": "0.18.23"
            },
            "devDependencies": {
              "typescript": "5.9.3",
              "@types/node": "^22.0.0",
              "tsx": "4.21.0"
            }
          }
          EOF
          cat > combat-verify/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ES2022",
              "module": "NodeNext",
              "moduleResolution": "NodeNext",
              "strict": true,
              "skipLibCheck": true,
              "noEmit": true,
              "types": ["node"]
            },
            "include": ["src/**/*.ts"]
          }
          EOF

      - name: Install server dependencies
        working-directory: combat-verify
        run: npm install --no-audit --no-fund

      - name: Type-check combat server
        working-directory: combat-verify
        run: npx tsc --noEmit

      # Windows VPS tsconfig.build.json can use strictNullChecks=false.
      # Build both ways so a discriminated-union failure cannot slip past CI.
      - name: Type-check Windows-compatible non-strict server
        working-directory: combat-verify
        run: npx tsc --noEmit --strict false

      # Windows tsconfig.build.json can combine strictNullChecks=false with
      # noImplicitAny=true. Mirror a production BUILD (exclude unit-test files
      # that aren't compiled on VPS): catches TS7011 in runtime sources.
      - name: Type-check Windows noImplicitAny without strictNullChecks
        working-directory: combat-verify
        shell: bash
        run: |
          cat > tsconfig.windows-build.json <<'EOF'
          {
            "extends": "./tsconfig.json",
            "exclude": ["src/**/*.test.ts"]
          }
          EOF
          npx tsc --noEmit -p tsconfig.windows-build.json --strict false --noImplicitAny true

      - name: Validate mobile S1 client adapter
        shell: bash
        run: |
          node --check main.js
          grep -q "serverFacing" main.js
          grep -Eq 'main\.js\?v=[0-9]+\.[0-9]+\.[0-9]+' index.html
          grep -q 'id="climb"' index.html
          grep -q 'id="shoot"' index.html
          grep -q 'function syncFortification' main.js
          grep -q 'room.send("climb"' main.js
          grep -q 'room.send("shoot"' main.js
          grep -q "function syncSummons" main.js
          grep -q 'room.send("unsummon"' main.js
          grep -q 'room.send("pot_summon"' main.js
          grep -q 'room.send("blessed_rice"' main.js
          grep -q 'tapPlayerForPK' main.js
          grep -q 'pvp_hit' main.js
          grep -q 'id="pkPanel"' index.html
          grep -q 'id="characterProfile"' index.html
          grep -q 'guestToken' main.js
          grep -q 'characterSlot' main.js
          grep -q 'slotChoice' main.js
          grep -q '0.3.2' index.html
          grep -q 'bagEquipped' main.js
          grep -q 'equip_weapon' main.js
          grep -q 'weaponsAvailable' deploy/combat/MyRoomState.ts
          grep -q 'grantStarterWeapons' deploy/combat/CharacterStore.ts
          grep -q 'MONTRA WEAPON BUILD PASSED.' deploy/combat/install-windows.ps1
          grep -q 'bagSlot' main.js
          grep -Fq 'sendBagCommand("use_item"' main.js
          grep -Fq 'inventory_state' main.js
          grep -Fq 'inventoryAvailable' deploy/combat/MyRoomState.ts
          grep -Fq 'inventory_record_missing' deploy/combat/CharacterStore.ts
          grep -Fq 'MONTRA INVENTORY BUILD PASSED.' deploy/combat/install-windows.ps1
          grep -q 'id="fly"' index.html
          grep -Fq 'room.send("fly", {})' main.js
          grep -Fq 'flightAvailable' main.js
          grep -Fq 'flight_started' main.js
          grep -Fq 'flight_finished' main.js
          grep -q 'room.send("dash", direction)' main.js
          grep -q 'function requestSwipeDash' main.js
          grep -q 'dashAvailable' main.js
          grep -q 'pointerdown' main.js
          grep -q 'suppressMenuClick' main.js
          grep -q 'touch-action:none' styles.css
          if grep -q 'id="dash"' index.html; then
            echo "Dash must use a bottom-menu swipe, not a new HUD button"
            exit 1
          fi
          grep -q 'CAMERA_ZOOM_MAX = 85' main.js
          grep -q 'CAMERA_DEFAULT_RADIUS = 85' main.js
          grep -q 'CAMERA_DEFAULT_BETA = 0.70' main.js
          grep -Fq 'CAMERA_DEFAULT_ALPHA = Math.PI / 2' main.js
          grep -Fq -- 'padding-top:var(--dash-swipe-reach)' styles.css
          grep -Fq -- '--dash-swipe-reach: clamp(80px, 12dvh, 108px)' styles.css
          grep -Fq 'pointer.beta + dy * .003' main.js
          grep -q 'touchSeparation()' main.js
          grep -q 'setCameraZoom(' main.js
          grep -q 'rename_character' main.js

      - name: Parse Windows PowerShell installer
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          $script = (Resolve-Path 'deploy/combat/install-windows.ps1').Path
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-Table
            exit 1
          }
          Write-Host "Windows installer syntax OK"

      - name: Syntax-check test scripts
        shell: bash
        run: |
          node --check deploy/combat/forest-party-monster-integration.mjs
          node --check deploy/combat/smoke-test.mjs
          node --check deploy/combat/s1-integration.mjs
          node --check deploy/combat/s1-monster-ai.mjs
          node --check deploy/combat/monster-rrt-integration.mjs
          node --check deploy/combat/dash-integration.mjs
          node --check deploy/combat/flight-integration.mjs
          node --check deploy/combat/weapon-integration.mjs
          node --check deploy/combat/world-warp-integration.mjs
          node --check deploy/combat/buff-integration.mjs
          node --check deploy/combat/private-chat-integration.mjs
          node --check deploy/combat/chat-integration.mjs
          node --check deploy/combat/progression-integration.mjs
          node --check deploy/combat/character-persistence-integration.mjs
          node --check deploy/combat/free-pk-integration.mjs
          node --check deploy/combat/summon-integration.mjs
          node --check deploy/combat/elevation-integration.mjs
          node --check deploy/combat/occult-integration.mjs
          node --check deploy/combat/occult-depth-integration.mjs

      - name: Test strict message validation and movement math
        working-directory: combat-verify
        run: npx tsx --test src/rooms/s1-rules.test.ts src/rooms/height-rules.test.ts src/rooms/monster-rrt.test.ts src/rooms/character-store.test.ts src/rooms/sword-tree-concurrency.test.ts src/rooms/sword-gap-geometry.test.ts src/rooms/dash-rules.test.ts src/rooms/item-rules.test.ts src/rooms/world-warp-rules.test.ts src/rooms/chat-rules.test.ts src/rooms/progression.test.ts src/rooms/progression-transaction.test.ts src/rooms/economy-store.test.ts src/rooms/economy-migration.test.ts src/rooms/party-manager.test.ts src/rooms/party-experience.test.ts src/rooms/monster-profiles.test.ts src/rooms/party-monster-rewards.test.ts src/rooms/buffs.test.ts src/rooms/stat-modifiers.test.ts src/rooms/buff-ledger.test.ts src/rooms/balance-estimates.test.ts src/rooms/forge.test.ts src/rooms/guild-store.test.ts

      - name: Occult book rules
        working-directory: combat-verify
        run: npx tsx --test src/rooms/occult-rules.test.ts src/rooms/blade-rules.test.ts src/rooms/sentinel-rules.test.ts

      - name: Isolated occult class
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4115 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-occult-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4115
          node --import tsx src/index.ts > occult-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4115) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 100s node occult-integration.mjs || { cat occult-server.log; exit 1; }
          timeout 100s node occult-depth-integration.mjs || { cat occult-server.log; exit 1; }

      - name: Isolated blade book
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4115 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-blade-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4115
          node --import tsx src/index.ts > blade-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4115) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node blade-book-integration.mjs || { cat blade-server.log; exit 1; }
          timeout 60s node blade-depth-integration.mjs || { cat blade-server.log; exit 1; }
          timeout 60s node blade-advanced-integration.mjs || { cat blade-server.log; exit 1; }

      - name: Isolated sentinel class
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4117 MONTRA_ECONOMY_ENABLED=1 MONTRA_WORLD_EXPANSION=1 MONTRA_RIDGE_TERRAIN=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-sentinel-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4117
          node --import tsx src/index.ts > sentinel-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true; rm -rf "$MONTRA_CHARACTER_DIR"' EXIT
          for attempt in $(seq 1 60); do if (echo > /dev/tcp/127.0.0.1/4117) 2>/dev/null; then break; fi; sleep 0.25; done
          timeout 60s node sentinel-integration.mjs || { cat sentinel-server.log; exit 1; }

      - name: Isolated party and EXP integration
        shell: bash
        working-directory: combat-verify
        run: |
          export PORT=4110 MONTRA_ECONOMY_ENABLED=1
          export MONTRA_CHARACTER_DIR="$(mktemp -d -t montra-party-test-XXXXXX)"
          export MONTRA_TEST_URL=http://127.0.0.1:4110
