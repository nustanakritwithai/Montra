name: Verify crafting NPC browser flow

on:
  push:
    paths:
      - 'qa/crafting/**'
      - '.github/workflows/verify-crafting-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crafting-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check crafting and shared item displays
        run: |
          node --check main.js
          node deploy/combat/item-modal-ui-test.cjs
          node deploy/combat/item-display-ui-test.cjs
          node deploy/combat/crafting-pages-ui-test.cjs
          node deploy/combat/forge-picker-ui-test.cjs
          node deploy/combat/artisan-wallet-ui-test.cjs
          node deploy/combat/forge-pages-ui-test.cjs
          node deploy/combat/forge-copy-ui-test.cjs
          node deploy/combat/gear-comparison-ui-test.cjs
          node deploy/combat/item-hunt-ui-test.cjs
          node deploy/combat/salvage-ui-test.cjs
          node deploy/combat/service-npcs-ui-check.cjs
      - name: Prepare disposable crafting-only runtime
        shell: bash
        run: |
          runtime="$(mktemp -d "$RUNNER_TEMP/montra-crafting-browser-XXXXXX")"
          echo "CRAFT_RUNTIME=$runtime" >> "$GITHUB_ENV"
          mkdir -p "$runtime/src/rooms/schema" "$runtime/libs"
          cp deploy/combat/*.ts "$runtime/src/rooms/"
          cp deploy/combat/MyRoomState.ts "$runtime/src/rooms/schema/"
          cp qa/crafting/seed.ts qa/crafting/server.ts "$runtime/src/"
          cp qa/crafting/package.json qa/crafting/run.mjs qa/crafting/product.json "$runtime/"
          # Match the production CDN libraries, then keep the browser fully local.
          curl --fail --silent --show-error --location https://cdn.babylonjs.com/babylon.js -o "$runtime/libs/babylon.js"
          curl --fail --silent --show-error --location https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js -o "$runtime/libs/babylonjs.loaders.min.js"
      - name: Install isolated browser and server dependencies
        run: |
          cd "$CRAFT_RUNTIME"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Talk to smith, craft, display item, restart and verify save
        timeout-minutes: 7
        env:
          MONTRA_REPO_ROOT: ${{ github.workspace }}
          MONTRA_CRAFT_ARTIFACTS: ${{ github.workspace }}/craft-evidence
        run: |
          cd "$CRAFT_RUNTIME"
          node run.mjs
      - name: Upload sanitized crafting evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafting-npc-browser-${{ github.sha }}
          path: craft-evidence/
          if-no-files-found: warn
          retention-days: 7
