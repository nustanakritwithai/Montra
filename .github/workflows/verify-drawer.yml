name: Verify MONTRA drawer
on:
  push:
    paths:
      - 'src/client-modules/drawer-controller.js'
      - 'src/client/ui/046-drawers-and-chat.js'
      - 'index.html'
      - 'styles.css'
      - 'src/styles/**'
      - 'deploy/combat/drawer-*.cjs'
      - 'deploy/combat/fixtures/drawer-controller-reference.js'
      - '.github/workflows/verify-drawer.yml'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
  pull_request:
    paths:
      - 'src/client-modules/drawer-controller.js'
      - 'src/client/ui/046-drawers-and-chat.js'
      - 'index.html'
      - 'styles.css'
      - 'src/styles/**'
      - 'deploy/combat/drawer-*.cjs'
      - 'deploy/combat/fixtures/drawer-controller-reference.js'
      - '.github/workflows/verify-drawer.yml'
      - 'scripts/build-client*.mjs'
      - 'package.json'
      - '.nvmrc'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drawer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Prepare generated client from sources
        run: npm run prepare:client
      - name: Verify frozen original and extracted lifecycle
        run: node deploy/combat/drawer-controller-test.cjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify real DOM in desktop and mobile Chromium
        run: node deploy/combat/drawer-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drawer-browser-evidence
          path: drawer-browser-evidence
