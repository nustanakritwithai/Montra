name: Verify forge NPC browser flow

on:
  push:
    paths:
      - 'qa/forge/**'
      - '.github/workflows/verify-forge-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        reduced-motion: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check forge selection and wallet recovery
        run: |
          node --check main.js
          node deploy/combat/forge-animation-ui-test.cjs
          node deploy/combat/forge-picker-ui-test.cjs
          node deploy/combat/artisan-wallet-ui-test.cjs
          node deploy/combat/forge-pages-ui-test.cjs
          node deploy/combat/forge-copy-ui-test.cjs
          node deploy/combat/service-npcs-ui-check.cjs
      - name: Prepare disposable forge-only runtime
        shell: bash
        run: |
          runtime="$(mktemp -d "$RUNNER_TEMP/montra-forge-browser-XXXXXX")"
          echo "FORGE_RUNTIME=$runtime" >> "$GITHUB_ENV"
          mkdir -p "$runtime/src/rooms/schema" "$runtime/libs"
          cp deploy/combat/*.ts "$runtime/src/rooms/"
          cp deploy/combat/MyRoomState.ts "$runtime/src/rooms/schema/"
          cp qa/forge/seed.ts qa/forge/server.ts "$runtime/src/"
          cp qa/forge/package.json qa/forge/run.mjs qa/forge/product.json "$runtime/"
          # Match the production CDN libraries, then keep the browser fully local.
          curl --fail --silent --show-error --location https://cdn.babylonjs.com/babylon.js -o "$runtime/libs/babylon.js"
          curl --fail --silent --show-error --location https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js -o "$runtime/libs/babylonjs.loaders.min.js"
      - name: Install isolated browser and server dependencies
        run: |
          cd "$FORGE_RUNTIME"
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Talk to smith, enhance, display result, restart and verify save
        timeout-minutes: 7
        env:
          MONTRA_FORGE_REDUCED_MOTION: ${{ matrix.reduced-motion }}
          MONTRA_REPO_ROOT: ${{ github.workspace }}
          MONTRA_FORGE_ARTIFACTS: ${{ github.workspace }}/forge-evidence
        run: |
          cd "$FORGE_RUNTIME"
          node run.mjs
      - name: Upload sanitized forge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-npc-browser-motion-${{ matrix.reduced-motion }}-${{ github.sha }}
          path: forge-evidence/
          if-no-files-found: warn
          retention-days: 7
