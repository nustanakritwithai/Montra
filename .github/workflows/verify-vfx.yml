name: Verify VFX rendering
on:
  push:
    paths:
      - 'src/client/**'
      - 'deploy/combat/*vfx*.cjs'
      - '.github/workflows/verify-vfx.yml'
  pull_request:
    paths:
      - 'src/client/**'
      - 'deploy/combat/*vfx*.cjs'
      - '.github/workflows/verify-vfx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble@sha256:f1e7e01021efd65dd1a2c56064be399f3e4de00fd021ac561325f2bfbb2b837a
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned test-only renderer and browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 babylonjs@8.34.0
      - name: Verify isolated real WebGL VFX
        run: node deploy/combat/vfx-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-browser-evidence
          path: vfx-browser-evidence
