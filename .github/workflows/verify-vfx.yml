name: Verify VFX rendering
on:
  push:
    paths:
      - 'src/client/**'
      - 'deploy/combat/*vfx*.cjs'
      - '.github/workflows/verify-vfx.yml'
  pull_request:
    paths:
      - 'src/client/**'
      - 'deploy/combat/*vfx*.cjs'
      - '.github/workflows/verify-vfx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install pinned test-only renderer and browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 babylonjs@8.34.0
          bash scripts/install-ci-chromium.sh npx playwright install --with-deps chromium
      - name: Verify isolated real WebGL VFX
        run: node deploy/combat/vfx-browser-test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vfx-browser-evidence
          path: vfx-browser-evidence
