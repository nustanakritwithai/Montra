<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#121d20" />
  <meta name="description" content="MONTRA — โลก MMORPG 3D อาคมไทย" />
  <title>MONTRA — โลกอาคม | Alpha 0.3.2</title>
  <link rel="stylesheet" href="./styles.css?v=field-journal-3" />
</head>
<body>
  <section id="accountEntry" class="account-entry" aria-label="เข้าสู่ระบบ MONTRA"><div id="accountCard" class="account-card" role="dialog" aria-modal="true"><strong>MONTRA</strong><p>กำลังเตรียมหน้าเข้าสู่ระบบ…</p></div></section>
  <main id="game" aria-label="MONTRA เกมสามมิติ">
    <canvas id="world" tabindex="0" aria-label="พื้นที่เกมสามมิติ แตะพื้นเพื่อเดิน"></canvas>
    <div id="loading" class="loading"><div class="loader-mark">๛</div><strong>MONTRA</strong><span id="loadingText">กำลังเตรียมหมู่บ้านอาคม...</span></div>

    <header class="top-hud">
      <div class="hud-journal">
      <section class="identity panel" aria-label="ข้อมูลตัวละคร">
        <div class="brand-row"><div class="brand">MONTRA <small>มนตรา</small></div><span id="modeBadge" class="badge">DEMO</span></div>
        <div class="character"><div class="portrait" id="classGlyph" aria-hidden="true">๛<b id="levelBadge">1</b></div><div class="character-info"><div class="name"><button id="characterProfile" class="profile-trigger" type="button" title="ข้อมูลตัวละคร"><span id="characterName">นที</span><span id="characterLevel">LV. 1</span></button></div><div class="bar hp" role="progressbar" aria-label="พลังชีวิต"><i></i><em id="hpText">100/100</em></div><div class="bar mp" id="staminaBar" role="progressbar" aria-label="กำลัง"><i></i><em id="staminaText"></em></div><div class="bar xp" id="expBar" role="progressbar" aria-label="ค่าประสบการณ์"><i></i></div><small id="expText" class="exp-text">EXP</small></div></div>
      </section>
    <button id="quest" class="quest panel" type="button" aria-label="เปิดรายละเอียดภารกิจ"><span class="quest-icon">◇</span><span class="quest-content"><strong>ภารกิจทดลอง</strong><span>แตะทางเดินไม้เพื่อสำรวจหมู่บ้าน</span><small id="questProgress" class="quest-progress"></small></span><span id="questPointer" class="quest-pointer" hidden><i id="questArrow">➤</i><small id="questDistance"></small></span></button>
    <button id="partyFrames" class="party-frames" type="button" aria-label="สมาชิกปาร์ตี้ · แตะเพื่อเปิด" hidden></button>
      </div>
      <section class="location-area">
        <button id="mapShortcut" class="mini-map" aria-label="เปิดแผนที่" title="เปิดแผนที่"><canvas id="minimap" width="160" height="160"></canvas><span class="mini-north">N</span></button>
        <div class="place-name" id="worldMapName">หมู่บ้านอาคม</div>
    <div class="online-count panel" id="onlineCount">ผู้เล่นในฉาก: 1 (จำลอง)</div>
      </section>
    </header>

    <section class="monster-status panel" id="monsterStatus" aria-label="สถานะมอนสเตอร์" hidden>
      <div class="monster-heading">
        <span id="targetName">ผีเข้าสิง · ตัวทดสอบ</span><b id="targetLevel" class="target-level"></b><strong id="monsterText">HP 100/100</strong>
      </div>
      <div class="monster-hp-track"><div id="monsterBar"></div></div>
      <small id="monsterHint">แตะตัวผีเพื่อโจมตี</small>
    </section>
    <section id="pkPanel" class="pk-panel panel" aria-label="Free PK ออนไลน์" hidden>
      <div class="pk-heading"><strong id="pkTitle">⚔ FREE PK</strong><span id="pkText">เปิดโจมตีผู้เล่น</span></div>
      <div class="pk-hp-track" id="pkHpTrack" hidden><div id="pkHpBar"></div></div>
      <small id="pkHint">แตะตัวผู้เล่นคนอื่นเพื่อโจมตี</small>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="warpLoading" class="warp-loading" role="status" hidden>กำลังเดินทาง…</div>

    <div class="field-dock">
      <div class="field-prompts">
    <button id="warpButton" class="warp-button" type="button" hidden></button>
    <button id="siegeGateButton" class="warp-button" type="button" hidden></button>
    <button id="climb" class="warp-button climb-context" type="button" title="ปีนหรือไต่ลงกำแพง" hidden><span aria-hidden="true">⇧</span> <span>ปีน</span></button>
    <button id="fly" class="warp-button flight-context" type="button" aria-pressed="false" hidden><span aria-hidden="true">✦</span> <span>ลงจอด</span></button>
      </div>
    <section class="controls" aria-label="ปุ่มควบคุมและพื้นที่ปัดพุ่งเหนือแถบสกิล">
      <div id="grappleResponse" class="sword-hotbar" aria-live="polite" hidden><button id="grappleResponseButton" class="sword-hotkey" type="button"></button></div>
      <div id="swordStatus" class="sword-status" role="status" aria-live="polite" hidden></div>
      <div id="swordHotbar" class="sword-hotbar" aria-label="ช่องลัดวิชาดาบ" hidden></div>
      <div id="muayStatus" class="sword-status" role="status" aria-live="polite" hidden></div>
      <div id="muayHotbar" class="sword-hotbar" aria-label="ช่องลัดวิชามวย" hidden></div>
      <div id="occultStatus" class="sword-status" role="status" aria-live="polite" hidden></div>
      <div id="occultHotbar" class="sword-hotbar" aria-label="ช่องลัดวิชาอาคม" hidden></div>
      <div id="bladeStatus" class="sword-status" role="status" aria-live="polite" hidden></div>
      <div id="bladeHotbar" class="sword-hotbar" aria-label="ช่องลัดวิชาคมดาบ" hidden></div>
      <div id="sentinelStatus" class="sword-status" role="status" aria-live="polite" hidden></div>
      <div id="sentinelHotbar" class="sword-hotbar" aria-label="ช่องลัดวิชาผู้พิทักษ์" hidden></div>
      <div class="skill-bar">
        <button id="summon" class="skill" type="button" aria-pressed="false" title="เสกผีจากหม้อ ช่วยโจมตีมอนสเตอร์ใกล้ตัว" hidden><span class="glyph violet" aria-hidden="true">🏺</span><span>เสกผีจากหม้อ</span></button>
        <button id="possess" class="skill" type="button" hidden><span class="glyph amber">✴</span><span>เข้าทรง</span></button>
        <button id="attack" class="skill" type="button"><span class="glyph red">⚔</span><span>โจมตี</span></button>
        <button id="shoot" class="skill" type="button" aria-pressed="false" aria-label="ข้าวสารปลุกเสก" title="ข้าวสารปลุกเสก · แตะเป้าหมายเพื่อซัดข้าวสาร" hidden><span class="glyph amber" aria-hidden="true">⁙</span><span>ซัดข้าวสาร</span></button>
        <button id="talisman" class="skill" type="button" aria-pressed="false" aria-label="ยันอาคมของขลัง" title="ยันอาคมของขลัง · แปะยันต์บนมอนสเตอร์ระยะประชิด" hidden><span class="glyph red" aria-hidden="true">◇</span><span>แปะยันต์</span></button>
        <button id="classSkill" class="skill" type="button" hidden><span class="glyph violet">✧</span><span>วิชา</span></button>
      </div>
    </section>

    </div>
    <nav class="field-shortcuts" aria-label="ทางลัดขณะเล่น">
      <button id="fieldMenuButton" type="button" aria-haspopup="dialog" aria-controls="drawer"><span aria-hidden="true">☰</span>เมนู<b id="fieldAlerts" aria-label="มีข้อความหรือคำเชิญใหม่" hidden>!</b></button>
      <button id="bag" type="button"><span aria-hidden="true">▣</span>กระเป๋า</button>
      <button id="quickSkills" type="button" aria-label="เปิดตำราสกิลอาชีพ"><span aria-hidden="true">✧</span>สกิล</button>
      <button id="chatButton" type="button" aria-label="เปิดแชท"><span>✉</span>แชท <b id="chatUnread" hidden></b></button>
      <button id="mountButton" type="button" aria-pressed="false" hidden><span>♞</span><i>เรียกม้า</i></button>
    </nav>
    <div id="shade" class="shade" hidden></div>
    <section id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
      <div class="drawer-grip"></div>
      <div class="drawer-header"><button id="drawerMenuBack" type="button" class="drawer-back" aria-label="กลับเมนูเกม" hidden>‹ เมนู</button><h2 id="drawerTitle">แผนที่</h2><button id="drawerClose" class="close" aria-label="ปิด">✕</button></div>
      <nav id="fieldMenu" aria-label="บันทึกผจญภัย" hidden>
        <button id="menuQuest" class="journal-objective" type="button">
          <span aria-hidden="true">◇</span><span><small>เป้าหมายตอนนี้</small><strong id="menuGoalTitle"></strong><span id="menuGoalStep"></span></span><i aria-hidden="true">›</i>
        </button>
        <div id="menuNotices" class="menu-notices" aria-label="คำเชิญที่รอตอบ" hidden>
          <button id="noticeParty" type="button" hidden>เปิดคำเชิญปาร์ตี้ ›</button>
          <button id="noticeGuild" type="button" hidden>เปิดคำเชิญกิลด์ ›</button>
          <button id="noticeTrade" type="button" hidden>เปิดคำขอเทรด ›</button>
        </div>
        <div class="journal-tabs" role="group" aria-label="หมวดเมนู">
          <button type="button" data-journal-tab="character" aria-controls="menu-character" aria-pressed="true">ตัวละคร</button>
          <button type="button" data-journal-tab="travel" aria-controls="menu-travel" aria-pressed="false">เดินทาง</button>
          <button type="button" data-journal-tab="social" aria-controls="menu-social" aria-pressed="false">ชุมชน</button>
          <button type="button" data-journal-tab="system" aria-controls="menu-system" aria-pressed="false">ตั้งค่า</button>
        </div>
        <section id="menu-character" data-journal-panel="character" aria-label="ตัวละครและวิชา"><div class="menu-tiles">
          <button id="menuCharacter" type="button"><span aria-hidden="true">๛</span><strong>สถานะตัวละคร<small>สเตตัส บัฟ และอาชีพ</small></strong></button>
          <button id="menuBag" type="button"><span aria-hidden="true">▣</span><strong>กระเป๋า<small>ใช้ยาและสวมอาวุธ</small></strong></button>
          <button id="swordTreeButton" class="book-entry" type="button" hidden><span>⚔</span>ตำราอาชีพ</button>
          <button id="muayBookButton" class="book-entry" type="button" hidden><span>✊</span>ตำราอาชีพ</button>
          <button id="occultBookButton" class="book-entry" type="button" hidden><span>✧</span>ตำราอาชีพ</button>
          <button id="bladeBookButton" class="book-entry" type="button" aria-label="เปิดสกิลคมดาบ" hidden><span>◈</span>ตำราอาชีพ</button>
          <button id="sentinelBookButton" class="book-entry" type="button" aria-label="เปิดสกิลผู้พิทักษ์" hidden><span>⬟</span>ตำราอาชีพ</button>
        </div></section>
        <section id="menu-travel" data-journal-panel="travel" aria-label="เดินทาง" hidden><div class="menu-tiles">
          <button id="mapButton" type="button"><span aria-hidden="true">⌖</span><strong>แผนที่<small>ตำแหน่งและจุดเดินทาง</small></strong></button>
          <button id="menuMount" type="button"><span aria-hidden="true">♞</span><strong id="menuMountLabel">เรียกม้า</strong></button>
        </div></section>
        <section id="menu-social" data-journal-panel="social" aria-label="ชุมชนและการค้า" hidden><div class="menu-tiles">
          <button id="menuChat" type="button"><span aria-hidden="true">✉</span><strong>แชท<small>แผนที่ รวม ปาร์ตี้ และส่วนตัว</small></strong><b id="menuChatUnread" hidden></b></button>
          <button id="partyButton" type="button"><span aria-hidden="true">♧</span><strong>ปาร์ตี้<small>ชวนเพื่อนออกล่า</small></strong><b id="partyUnread" hidden>!</b></button>
          <button id="menuGuild" type="button"><span aria-hidden="true">⚑</span><strong>กิลด์</strong></button>
          <button id="marketButton" type="button"><span aria-hidden="true">♢</span><strong>ตลาดและเทรด<small>ฝากขายหรือแลกกับผู้เล่น</small></strong><b id="tradeUnread" hidden>!</b></button>
        </div></section>
        <section id="menu-system" data-journal-panel="system" aria-label="ตั้งค่าและบัญชี" hidden>
          <div class="field-layout-picker" role="group" aria-label="รูปแบบหน้าจอ">
            <span>รูปแบบหน้าจอ</span><button type="button" data-field-layout="adventure" aria-pressed="true">ผจญภัย</button><button type="button" data-field-layout="combat" aria-pressed="false">เน้นต่อสู้</button>
          </div>
          <label class="field-utility-label" for="fieldUtility">ทางลัดประจำสนาม
            <select id="fieldUtility"><option value="chat">แชท</option><option value="mount">ขี่ม้า (เมื่อเรียกได้)</option></select>
          </label>
          <div class="menu-tiles">
            <button id="helpButton" type="button"><span aria-hidden="true">?</span><strong>คู่มือ ภาพ และเสียง</strong></button>
            <button id="modeButton" type="button"><span aria-hidden="true">◎</span><strong>บัญชีและตัวละคร</strong></button>
          </div>
        </section>
      </nav>
      <div id="drawerBody" class="drawer-body"></div>
    </section>
  </main>
  <script src="./account-entry.js?v=field-journal-3"></script>
  <script src="https://cdn.babylonjs.com/babylon.js" defer></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js" defer></script>
  <script src="https://unpkg.com/@colyseus/sdk@0.18.1/dist/colyseus.js" defer></script>
  <script src="./audio.js?v=0.9.10-horse-bright" defer></script>
  <script src="./main.js?v=field-journal-3" defer onerror="window.MontraEntry?.worldUnavailable('โหลดเกมไม่สำเร็จ กรุณาลองอีกครั้ง')"></script>
</body>
</html>
